<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensaje codificado</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #080909;
      color: #a7aaa6;
      font-family: "Courier New", monospace;
    }

    p {
      margin: 0;
      padding: 24px;
      font-size: 15px;
      line-height: 1.7;
      text-align: center;
    }

    .img {
      width: 100%;
      height: auto;
      max-width: 400px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <p>aqui hay un mensaje codificado, descubrelo</p>
  <img src="images.jpe" alt="Mensaje codificado" class="img">
</body>
</html>
